openapi: 3.1.0
info:
  title: Chebit API
  version: 1.0.0
  description: |
    Payment core API. Each amount is an integer in the smallest unit of its currency
    (for example centavos for ARS). No amount is a float.
    A write request needs an `Idempotency-Key` header (1 to 255 characters). A retry with the
    same key and the same body gets the first response, with the header `Idempotent-Replayed: true`.
    The same key with another body or query string gives 409 `idempotency_key_reused`.
    A 5xx response is not stored. A write request must send `Content-Type: application/json`;
    any other type gives 415 `unsupported_media_type`.
servers:
  - url: http://localhost:4000
security:
  - bearer: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The service runs.
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {type: string, const: ok}}}
  /v1/payment_intents:
    post:
      summary: Create a payment intent
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, currency]
              properties:
                amount_minor: {type: integer, minimum: 1}
                currency: {type: string, description: "A supported currency code, for example ARS."}
                description: {type: string, maxLength: 500}
                metadata: {type: object}
      responses:
        "201": {$ref: "#/components/responses/Intent201"}
        "400": {$ref: "#/components/responses/IdempotencyKeyRequired"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/IdempotencyConflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/Invalid"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/payment_intents/{id}:
    get:
      summary: Read a payment intent of the merchant
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200":
          description: The intent.
          content: {application/json: {schema: {$ref: "#/components/schemas/Intent"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/payment_intents/{id}/confirm:
    post:
      summary: Send the intent to a provider
      description: |
        Returns `next_action` with what the payer needs, for example a QR string.
        A confirm with the same provider after the provider has the payment sends nothing
        and returns the intent as it is now, whatever its status.
        The provider is read from the body only.
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: {type: string, examples: [simulated]}
      responses:
        "202":
          description: The provider has the payment. The intent is `pending` on the first confirm.
          headers:
            Idempotent-Replayed: {description: "true when the response comes from the store.", schema: {type: string, const: "true"}}
          content: {application/json: {schema: {$ref: "#/components/schemas/Intent"}}}
        "400": {$ref: "#/components/responses/IdempotencyKeyRequired"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Error codes `invalid_state`, `idempotency_key_reused` or `request_in_progress`.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          description: Error codes `invalid_request`, `unknown_provider` or `provider_declined`.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "503":
          description: Error code `provider_unavailable`. The outcome is unknown. Retry with the same key.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/balances:
    get:
      summary: Balances of the merchant, one for each currency
      responses:
        "200":
          description: The balance accounts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [currency, balance_minor, held_minor, available_minor]
                      properties:
                        currency: {type: string}
                        balance_minor: {type: integer}
                        held_minor: {type: integer, description: "Funds that can still reverse."}
                        available_minor: {type: integer, description: "balance_minor minus held_minor."}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /webhooks/{provider}:
    post:
      summary: Receive a provider webhook
      description: The provider signs the exact body. The signature header depends on the provider.
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, examples: [simulated]}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        "200":
          description: Stored, or already stored (duplicate).
          content:
            application/json:
              schema: {type: object, required: [received], properties: {received: {type: boolean, const: true}}}
        "400":
          description: Error code `malformed`.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Error code `invalid_signature`.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, description: "The merchant API key."}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
  responses:
    Intent201:
      description: The intent was created.
      headers:
        Idempotent-Replayed: {description: "true when the response comes from the store.", schema: {type: string, const: "true"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/Intent"}}}
    IdempotencyKeyRequired:
      description: Error code `idempotency_key_required`.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: Error code `unauthorized`. The API key is missing or wrong.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: Error code `not_found`.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UnsupportedMediaType:
      description: Error code `unsupported_media_type`. The body is not `application/json`.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    IdempotencyConflict:
      description: Error code `idempotency_key_reused` or `request_in_progress`.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Invalid:
      description: Error code `invalid_request`. `fields` lists the messages for each field.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Internal:
      description: Error code `internal_error`.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Intent:
      type: object
      required: [id, status, amount_minor, currency, description, metadata, failure_reason, expires_at, created_at, next_action]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [created, pending, paid, disputed, final, refunded, failed, expired]}
        amount_minor: {type: integer}
        currency: {type: string}
        description: {type: [string, "null"]}
        metadata: {type: object}
        failure_reason: {type: [string, "null"]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        next_action:
          type: [object, "null"]
          description: Set while the intent is `pending`, else null.
          properties:
            provider: {type: string}
            payment_data: {type: object}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: array, items: {type: string}}}
